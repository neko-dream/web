#:schema node_modules/wrangler/config-schema.json
name = "web"
compatibility_date = "2024-10-18"
workers_dev = false
preview_urls = false

# 本番は kotohiro.com / www.kotohiro.com。
# previews_enabled = true により、Preview は <preview-name>.kotohiro.com で配信される
# （develop ブランチ → develop.kotohiro.com、staging ブランチ → staging.kotohiro.com）
routes = [
  { pattern = "kotohiro.com", custom_domain = true, previews_enabled = true },
  { pattern = "www.kotohiro.com", custom_domain = true }
]

# SPA の静的ファイルのみを配信する（Worker スクリプトなし）
[assets]
directory = "./build/client"
not_found_handling = "single-page-application"

# 同じ Worker "web" の Preview として develop を扱う
[env.develop]
name = "web"
routes = [
  { pattern = "kotohiro.com", custom_domain = true, previews_enabled = true }
]

[env.develop.previews]

# 同じ Worker "web" の Preview として staging を扱う
[env.staging]
name = "web"
routes = [
  { pattern = "kotohiro.com", custom_domain = true, previews_enabled = true }
]

[env.staging.previews]

# Cloudflare Workers Builds の本番デプロイ用（--env production が渡される）
[env.production]
name = "web"
routes = [
  { pattern = "kotohiro.com", custom_domain = true, previews_enabled = true },
  { pattern = "www.kotohiro.com", custom_domain = true }
]
