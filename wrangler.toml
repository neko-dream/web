#:schema node_modules/wrangler/config-schema.json
name = "web"
compatibility_date = "2024-10-18"
workers_dev = false
preview_urls = true

# SPA の静的ファイルのみを配信する（Worker スクリプトなし）
[assets]
directory = "./build/client"
not_found_handling = "single-page-application"

# Cloudflare Workers Builds の develop プレビュー用
[env.develop]
name = "web"
preview_urls = true

[env.develop.previews]

# Cloudflare Workers Builds の本番デプロイ用
[env.production]
name = "web"
preview_urls = false
routes = [
  { pattern = "kotohiro.com", custom_domain = true },
  { pattern = "www.kotohiro.com", custom_domain = true }
]
