name: PR bot
run-name: 🚀 Auto Promote to ${{ github.ref == 'refs/heads/staging' && 'Production' || 'Staging' }}

on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - staging

jobs:
  create:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set git config
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Set target branch and message
        id: config
        run: |
          if [[ ${{ github.ref }} == 'refs/heads/staging' ]]; then
            echo "target_branch=main" >> $GITHUB_OUTPUT
            echo "pr_title=🚀 本番反映" >> $GITHUB_OUTPUT
          else
            echo "target_branch=staging" >> $GITHUB_OUTPUT
            echo "pr_title=🚀 ステージング反映" >> $GITHUB_OUTPUT
          fi

      - name: Get commit messages
        id: commits
        run: |
          # ターゲットブランチとの共通祖先を見つける
          merge_base=$(git merge-base origin/${{ steps.config.outputs.target_branch }} HEAD)

          # コミットメッセージを取得してフォーマット
          commits=$(git log --pretty=format:"- %s" $merge_base..HEAD)

          # 改行をエスケープして出力
          echo "commits<<EOF" >> $GITHUB_OUTPUT
          echo "$commits" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Check PR exist
        id: check_pr_exist
        run: |
          pr_list=$(gh pr list -B "${{ steps.config.outputs.target_branch }}" --json number,title --jq '.')
          count=$(echo "$pr_list" | jq 'length')

          echo "count=$count" >> $GITHUB_OUTPUT

          if [[ $count -gt 0 ]]; then
            pr_number=$(echo "$pr_list" | jq -r '.[0].number')
            echo "number=$pr_number" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create PR
        if: ${{ steps.check_pr_exist.outputs.count == 0 }}
        run: |
          pr_body="${{ steps.config.outputs.pr_header }}

          ## 含まれるコミット

          ${{ steps.commits.outputs.commits }}"

          gh pr create -B "${{ steps.config.outputs.target_branch }}" \
            -t "${{ steps.config.outputs.pr_title }}" \
            -b "$pr_body"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update existing PR
        if: ${{ steps.check_pr_exist.outputs.count > 0 }}
        run: |
          # 既存のPR本文を取得
          current_body=$(gh pr view ${{ steps.check_pr_exist.outputs.number }} --json body --jq '.body')

          # "## 含まれるコミット"以降を新しいコミットリストに置換
          new_body=$(echo "$current_body" | sed '/## 含まれるコミット/,$d')

          new_body="${new_body}

          ## 含まれるコミット

          ${{ steps.commits.outputs.commits }}"

          gh pr edit ${{ steps.check_pr_exist.outputs.number }} --body "$new_body"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
