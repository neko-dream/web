name: Lint & Typecheck

on:
  pull_request:
    types:
      - opened
      - synchronize

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Lint & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup mise
        uses: jdx/mise-action@v5.2.7

      - name: Prepare pnpm store
        run: mkdir -p ~/.local/share/pnpm/store

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run typecheck
        env:
          CLOUDFLARE_ENV: develop
        run: pnpm typecheck

      - name: Verify generated API types
        run: |
          pnpm generate:api
          git diff --exit-code -- app/types/openapi.ts

      - name: Run Lint
        run: pnpm lint

      - name: Run tests
        run: pnpm test
